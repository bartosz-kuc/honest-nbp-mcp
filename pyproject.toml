[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbp-mcp"
version = "0.1.0"
description = "Local MCP server for NBP FX rates + gold fixing (Polish accounting-ready data)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bartosz Kuć", email = "firma@bartosza.pl" }]
keywords = ["mcp", "nbp", "fx", "forex", "poland", "accounting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/bartosz-kuc/nbp-mcp"
Repository = "https://github.com/bartosz-kuc/nbp-mcp"
Issues = "https://github.com/bartosz-kuc/nbp-mcp/issues"

[project.scripts]
nbp-mcp = "nbp_mcp:sync_main"

[tool.hatch.build.targets.wheel]
sources = ["."]
only-include = ["server.py"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "nbp_mcp.py"

[tool.hatch.build.targets.sdist]
include = ["server.py", "README.md", "LICENSE", "SECURITY.md", "pyproject.toml"]
